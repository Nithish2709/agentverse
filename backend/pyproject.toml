[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pds-sentinel-ai"
version = "0.1.0"
description = "Agentic AI platform for monitoring the Public Distribution System"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    # Database
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "aiosqlite==0.20.0",       # test-only but kept here for simplicity
    # Redis
    "redis==5.2.1",
    # Auth
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    # Config
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    # Logging
    "structlog==24.4.0",
    # HTTP client (for tests)
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
    "black==24.10.0",
    "pre-commit==4.0.1",
    "mypy==1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=app --cov-report=term-missing --cov-report=html"
filterwarnings = ["ignore::DeprecationWarning"]

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*", "app/agents/*", "app/graph/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "ANN",      # flake8-annotations
    "S",        # flake8-bandit
    "PLW",      # pylint warnings
    "ARG",      # flake8-unused-arguments
]
ignore = [
    "ANN101",   # missing type annotation for self
    "ANN102",   # missing type annotation for cls
    "S101",     # use of assert (needed in tests)
    "B008",     # do not perform function calls in default arguments (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["ANN", "S", "ARG"]
"alembic/*" = ["ANN", "ARG"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ── Black ─────────────────────────────────────────────────────────────────────
[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/", "app/tests/"]
