services:
  # ── API ─────────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      target: development
    container_name: pds_api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      APP_ENV: development
      DEBUG: "true"
      DATABASE_URL: postgresql://pds_user:pds_password@postgres:5432/pds_sentinel
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-key-change-in-production-32chars
      LOG_FORMAT: text
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - pds_network
    restart: unless-stopped

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: pds_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pds_user
      POSTGRES_PASSWORD: pds_password
      POSTGRES_DB: pds_sentinel
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pds_user -d pds_sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pds_network
    restart: unless-stopped

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pds_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - pds_network
    restart: unless-stopped

  # ── Adminer (dev DB UI) ───────────────────────────────────────────────────────
  adminer:
    image: adminer:4
    container_name: pds_adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - pds_network
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:

networks:
  pds_network:
    driver: bridge
